# This file contains common pin mappings for the BIGTREETECH EBB PRO R1
#
# Use katapult
# STM32H723 with a "128KiB bootloader" "25 MHz crystal"
# "CAN bus (on PD0/PD1)".
#
# If not use katapult
# STM32H723 with a "no bootloader" "25 MHz crystal"
# "CAN bus (on PD0/PD1)".

# See docs/Config_Reference.md for a description of parameters.

# connect
[mcu ebbpro]
canbus_uuid: 11aa22bb33cc

# extruder
[extruder]
step_pin: ebbpro:PB6
dir_pin: ebbpro:PB7
enable_pin: !ebbpro:PB4

# For LGX Lite
rotation_distance: 55
gear_ratio: 44:10, 37:17 

microsteps: 256
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75

# Heater pin
heater_pin: ebbpro:PE0

# Use PT1000 with max31865
sensor_type: MAX31865

sensor_pin: ebbpro:PB12
spi_software_sclk_pin: ebbpro:PB13
spi_software_mosi_pin: ebbpro:PB15
spi_software_miso_pin: ebbpro:PB14

# Use NTC 100k with th0
# sensor_type: ATC Semitec 104GT-2
# pullup_resistor: 2200
# sensor_pin: ebbpro:PB1

# Control
control: pid
pid_Kp = 28.698
pid_Ki = 1.952
pid_Kd = 105.465
min_temp: -40
max_temp: 350
max_power: 1.0
min_extrude_temp: 0
max_extrude_only_distance: 200.0

pressure_advance: 0.02
pressure_advance_smooth_time: 0.030

# Driver
[tmc2209 extruder]
uart_pin: ebbpro: PB5
run_current: 0.6  # For LGX Lite motor
interpolate: False
stealthchop_threshold: 0

# Probe
[probe]
pin: ^ebbpro:PC6
x_offset: 0.0
y_offset: 0.0
z_offset: 0.0

samples: 3
samples_result: median
sample_retract_dist: 1.0
speed: 10

# Fan 1
[fan]
pin: ebbpro:PE13
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010

hardware_pwm: False
tachometer_pin: ebbpro:PA1
tachometer_ppr: 2
tachometer_poll_interval: 0.0015

# Fan 2
[heater_fan hotend_fan]
heater: extruder
pin: ebbpro:PE14
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010

hardware_pwm: False
tachometer_pin: ebbpro:PB11
tachometer_ppr: 2
tachometer_poll_interval: 0.0015

# EBB PRO R1 cooling fan
[temperature_fan ebbpro]
pin: ebbpro:PC0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: False
tachometer_pin: ebbpro:PE6
tachometer_ppr: 2
tachometer_poll_interval: 0.0015
sensor_type: temperature_mcu
sensor_mcu: ebbpro
min_temp: -40
max_temp: 105
target_temp: 40.0

max_speed: 1.0
min_speed: 0.0
off_below: 0.2

control: pid
pid_Kp: 20
pid_Ki: 1
pid_Kd: 0

[lis2dw]
cs_pin: ebbpro:PA4
spi_software_sclk_pin: ebbpro:PA5
spi_software_mosi_pin: ebbpro:PA7
spi_software_miso_pin: ebbpro:PA6
axes_map: z,-y,-x

[resonance_tester]
accel_chip: lis2dw
probe_points: 150, 150, 30

